# =====================================================================
#  Sveltia CMS 配置 · 站内 Git 后台编辑
#  （2026-09-19 由 Decap CMS 迁移而来，后台入口与 GitHub 登录方式不变）
# ---------------------------------------------------------------------
#  · 后台入口：https://portfolio-site-7i5.pages.dev/admin/
#  · 登录方式：点「使用 GitHub 登录」，在弹出窗口完成授权即可，无需密码。
#    授权链路为 /api/auth → GitHub → /api/callback（functions/api/ 内），
#    GitHub OAuth App 的回调地址无需改动。
#  · 数据文件：content/data.json —— 字段名与嵌套层级和迁移前完全一致；
#    前端 build.js / site.js 依赖该结构，请勿改动下面各字段的 name。
#  · 保存 → 自动提交到 GitHub main 分支 → Cloudflare Pages 自动重新构建
#    （node build.js 生成 assets/js/data.js）并发布，通常 1 分钟内生效。
#  · 表单阅读顺序：作品列表（最常用）→ 作品类型 → 个人信息（默认折叠）。
#  · 需要退回 Decap CMS：见仓库根目录 _legacy-decap-backup/README.md
# =====================================================================

backend:
  name: github
  # 你的 GitHub 仓库，格式为 用户名/仓库名（区分大小写）
  repo: "zhao6822/portfolio-site"
  # 站点部署所用分支，Cloudflare Pages 监听的就是这个分支
  branch: "main"
  # 站点正式访问域名，结尾不要带斜杠（登录回调地址由此域名拼接）
  # 如日后绑定自定义域名，请同步修改此处与 GitHub OAuth App 的 Homepage / 回调地址
  base_url: "https://portfolio-site-7i5.pages.dev"
  # 登录中转接口，固定写法，对应 functions/api/auth.js，无需修改
  auth_endpoint: "/api/auth"

# 站点地址：后台「查看站点」按钮的跳转目标
site_url: "https://portfolio-site-7i5.pages.dev"

# 后台界面语言：简体中文
locale: zh_Hans

# 保存方式：手动保存（不做自动发布，避免误触即上线）
publish_mode: simple

# 图片等媒体文件：后台上传后直接写入仓库 assets/uploads/，
# 内容里以相对路径引用，本地双击预览与线上都能正常显示
media_folder: "assets/uploads"
public_folder: "assets/uploads"

# ---------------------------------------------------------------------
#  内容集合：本站所有内容集中在 content/data.json 一个文件，因此使用
#  「单文件（files）」结构。注意：保存时会按下面的 fields 重建该文件，
#  未在此声明的键会被丢弃 —— 新增字段前请先确认前端是否需要对应读取。
# ---------------------------------------------------------------------
collections:
  - name: site
    label: 站点内容
    label_singular: 站点内容
    description: >-
      修改后点「保存」即自动提交到 GitHub，Cloudflare Pages 会自动重新构建
      （执行 node build.js 生成 assets/js/data.js）并发布，通常 1 分钟内生效。
    delete: false
    files:
      - name: data
        label: 全站数据
        file: content/data.json
        fields:
          # ============ ① 作品列表（最常编辑，已置顶） ============
          - label: 作品列表
            name: works
            widget: list
            label_singular: 作品
            summary: "{{fields.title}}"
            hint: "每件作品折叠成一行显示，点标题即可展开填写；拖动手柄可调整顺序。前台按「交付时间」倒序展示，与这里的排列顺序无关。"
            fields:
              - label: 作品标题
                name: title
                widget: string
                hint: "必填。显示在首页卡片与详情页标题，如「蔚蓝汽车 · 春季品牌片」"
              - label: 作品链接标识
                name: id
                widget: string
                hint: "必填。英文小写字母 + 短横线，作品之间不可重复，如 auto-brand-film。详情页链接 project.html?id=xxx 依赖它，留空会导致作品详情页打不开"
              - label: 客户 / 品牌
                name: client
                widget: string
                required: false
                hint: "客户或品牌名称，如「蔚蓝汽车」；没有可留空"
              - label: 作品类型
                name: category
                widget: select
                required: false
                options: ["商业广告", "品牌内容", "电商", "短视频", "纪录片", "MV", "混剪"]
                hint: "从下拉中选择，避免手填出现错别字。下拉选项需与「作品类型（首页筛选按钮）」保持一致；如需新增类型，请在本文档 works → category → options 中同步添加"
              - label: 交付时间
                name: deliveredAt
                widget: datetime
                required: false
                date_format: "YYYY-MM"
                time_format: false
                format: "YYYY-MM"
                hint: "点输入框右侧图标选择年月即可，无需手打；前台首页与时间线按此时间倒序排列"
              - label: 成片时长
                name: duration
                widget: string
                required: false
                hint: "如 0:30 / 1:45 / 3:20；没有可留空"
              - label: 担任角色
                name: roles
                widget: list
                required: false
                label_singular: 角色
                hint: "你在这支片子里负责的环节，如「剪辑」「调色」；点「+」可增加多条"
                field: { label: 角色名称, name: role, widget: string, required: false, hint: "如：剪辑" }
              - label: 使用软件
                name: software
                widget: list
                required: false
                label_singular: 软件
                hint: "这支片子用到的软件，如 Premiere Pro、DaVinci Resolve；点「+」可增加多条"
                field: { label: 软件名称, name: item, widget: string, required: false, hint: "如：DaVinci Resolve" }
              - label: 封面图
                name: cover
                widget: image
                required: false
                hint: "点「上传」即可把本地图片直接传到仓库 assets/uploads/ 并自动引用；建议 16:9 横图。留空则前台显示渐变占位图"
              - label: 视频播放源
                name: video
                widget: object
                collapsed: true
                required: false
                fields:
                  - label: 播放方式
                    name: type
                    widget: select
                    required: false
                    options:
                      - { label: "外链嵌播（B站 / Vimeo / YouTube）", value: "iframe" }
                      - { label: "站内视频文件（assets/videos 下的 mp4）", value: "file" }
                    hint: "B站 / YouTube 选第一项；已把视频放进仓库 assets/videos/ 的选第二项"
                  - label: 视频地址
                    name: url
                    widget: string
                    required: false
                    hint: "第一项填嵌播地址（B站播放器地址或 YouTube 链接）；第二项填 assets/videos/xxx.mp4"
              - label: 一句话成果
                name: summary
                widget: text
                required: false
                hint: "一句话概括这支片子的效果，显示在首页卡片与时间线，如「30 天全网播放 1200 万」"
              - label: 项目背景
                name: background
                widget: text
                required: false
                hint: "客户需求与这支片子要解决的问题，2-4 句即可"
              - label: 处理思路
                name: approach
                widget: list
                required: false
                label_singular: 思路要点
                hint: "你的剪辑思路要点，每条一句；点「+」可增加多条"
                field: { label: 要点内容, name: point, widget: text, required: false, hint: "一条思路要点，写清怎么剪、为什么这样剪" }
              - label: 成果数据
                name: results
                widget: list
                required: false
                label_singular: 数据项
                summary: "{{fields.label}}：{{fields.value}}"
                hint: "如「全网播放量：1200 万」；点「+」可增加多条"
                fields:
                  - { label: 指标名称, name: label, widget: string, required: false, hint: "如：全网播放量" }
                  - { label: 指标数值, name: value, widget: string, required: false, hint: "如：1200 万" }
              - label: 相关链接
                name: links
                widget: list
                required: false
                label_singular: 链接
                summary: "{{fields.label}}"
                hint: "这支片子的成片地址、客户官网等；点「+」可增加多条"
                fields:
                  - { label: 链接名称, name: label, widget: string, required: false, hint: "如：B站成片" }
                  - { label: 链接地址, name: url, widget: string, required: false, hint: "以 https:// 开头的完整网址" }

          # ============ ② 作品类型（首页筛选按钮） ============
          - label: 作品类型（首页筛选按钮）
            name: categories
            widget: list
            label_singular: 作品类型
            required: false
            hint: "这里每一项会变成首页的一个筛选按钮，建议不超过 8 个。名称需与每件作品「作品类型」的下拉选项完全一致，否则筛选不到；新增类型时请同时更新本文档 works → category → options"
            field: { label: 类型名称, name: category, widget: string, required: false, hint: "如：商业广告" }

          # ============ ③ 个人信息与主页内容（改动较少，默认折叠） ============
          - label: 个人信息（姓名 / 简介 / 联系方式）
            name: profile
            widget: object
            collapsed: true
            fields:
              - { label: 姓名, name: name, widget: string, hint: "显示在首页大标题与页脚" }
              - { label: 职业头衔, name: title, widget: string, required: false, hint: "如「视频剪辑师 / 后期导演」" }
              - { label: 一句话主张, name: tagline, widget: string, required: false, hint: "首页副标题，一句话说明你擅长什么，如「用剪辑讲好品牌故事」" }
              - { label: 个人简介, name: bio, widget: text, required: false, hint: "2-4 句自我介绍，显示在「关于」区域" }
              - { label: 所在城市, name: location, widget: string, required: false, hint: "如「杭州」；没有可留空" }
              - { label: 从业年限, name: years, widget: string, required: false, hint: "如「6 年」；没有可留空" }
              - { label: 邮箱, name: email, widget: string, required: false, hint: "如 hello@example.com；留空则该联系方式不在前台显示" }
              - { label: 电话, name: phone, widget: string, required: false, hint: "如 138 0000 0000；留空则该联系方式不在前台显示" }
              - { label: 微信号, name: wechat, widget: string, required: false, hint: "如 zhaoyu_design；留空则该联系方式不在前台显示" }

              - label: 首页 Showreel（主视觉视频）
                name: showreel
                widget: object
                collapsed: true
                fields:
                  - { label: 标题, name: title, widget: string, required: false, hint: "显示在首页主视觉区的大标题，如「2025 精选合辑」" }
                  - { label: 副标题, name: subtitle, widget: string, required: false, hint: "标题下一行的小字，如「Brand Film · Commercial」" }
                  - { label: 片长, name: duration, widget: string, required: false, hint: "如 1:30；没有可留空" }
                  - label: 封面图
                    name: cover
                    widget: image
                    required: false
                    hint: "点「上传」直接传到仓库 assets/uploads/；建议 16:9。留空则前台显示渐变占位"
                  - label: 封面提示文字
                    name: hint
                    widget: string
                    required: false
                    hint: "显示在封面上的小字，如「点击播放」；留空则不显示"
                  - label: 视频播放源
                    name: video
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - label: 播放方式
                        name: type
                        widget: select
                        required: false
                        options:
                          - { label: "外链嵌播（B站 / Vimeo / YouTube）", value: "iframe" }
                          - { label: "站内视频文件（assets/videos 下的 mp4）", value: "file" }
                        hint: "B站 / YouTube 选第一项；已把视频放进仓库 assets/videos/ 的选第二项"
                      - label: 视频地址
                        name: url
                        widget: string
                        required: false
                        hint: "第一项填嵌播地址（B站播放器地址或 YouTube 链接）；第二项填 assets/videos/xxx.mp4"

              - label: 擅长方向与风格
                name: strengths
                widget: list
                required: false
                label_singular: 擅长方向
                summary: "{{fields.title}}"
                hint: "如「品牌叙事」「快节奏混剪」；点「+」可增加多条，建议 3-6 条"
                fields:
                  - { label: 方向名称, name: title, widget: string, required: false, hint: "如：品牌叙事" }
                  - { label: 说明, name: desc, widget: text, required: false, hint: "一句话说明这个方向，如「擅长把产品卖点编成有情绪的故事」" }

              - label: 软件与工具
                name: software
                widget: list
                required: false
                label_singular: 软件分组
                summary: "{{fields.group}}"
                hint: "按用途分组展示，如「剪辑」「调色」；点「+」可增加分组"
                fields:
                  - { label: 分组名称, name: group, widget: string, required: false, hint: "如：剪辑" }
                  - label: 软件列表
                    name: items
                    widget: list
                    required: false
                    label_singular: 软件
                    hint: "这一组里用到的软件，点「+」可增加多条"
                    field: { label: 软件名称, name: item, widget: string, required: false, hint: "如：Premiere Pro" }

              - label: 合作品牌 / 客户
                name: brands
                widget: list
                required: false
                label_singular: 品牌
                hint: "首页会滚动展示这些品牌名；点「+」可增加多条"
                field: { label: 品牌名称, name: brand, widget: string, required: false, hint: "如：蔚蓝汽车" }

              - label: 工作流程
                name: workflow
                widget: list
                required: false
                label_singular: 流程步骤
                summary: "{{fields.title}}"
                hint: "展示你的合作流程，按先后顺序排列；点「+」可增加步骤"
                fields:
                  - { label: 步骤名称, name: title, widget: string, required: false, hint: "如：需求沟通" }
                  - { label: 说明, name: desc, widget: text, required: false, hint: "这一步做什么、交付什么，一句话即可" }

              - label: 联系方式 / 外部链接
                name: links
                widget: list
                required: false
                label_singular: 链接
                summary: "{{fields.label}}"
                hint: "如 B站主页、小红书、站酷等；点「+」可增加多条"
                fields:
                  - { label: 链接名称, name: label, widget: string, required: false, hint: "如：B站主页" }
                  - { label: 链接地址, name: url, widget: string, required: false, hint: "以 https:// 开头的完整网址" }
